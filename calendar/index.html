<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>한비 일정</title>
  <style>
:root {
      --bg-top: #dff5ff;
      --bg-mid: #f7fcff;
      --bg-bottom: #eaf8ff;
      --sky: #75cdf2;
      --sky-soft: #dff5ff;
      --sky-light: #f0fbff;
      --blue: #4fb6e4;
      --deep: #2f86b5;
      --text: #31566b;
      --muted: #6f8fa0;
      --line: rgba(126, 205, 242, .28);
      --white: #ffffff;
      --card: rgba(255, 255, 255, .84);
      --shadow: 0 20px 55px rgba(70, 166, 215, .18);
      --radius: 28px;
    }

    * { box-sizing: border-box; }

    html { scroll-behavior: smooth; }

    body {
      margin: 0;
      min-height: 100vh;
      font-family: "Pretendard", "Apple SD Gothic Neo", "Noto Sans KR", system-ui, -apple-system, BlinkMacSystemFont, sans-serif;
      color: var(--text);
      background:
        radial-gradient(circle at 18% 8%, rgba(255,255,255,.92) 0 7%, transparent 17%),
        radial-gradient(circle at 83% 16%, rgba(255,255,255,.78) 0 6%, transparent 16%),
        linear-gradient(180deg, var(--bg-top) 0%, var(--bg-mid) 48%, var(--bg-bottom) 100%);
      overflow-x: hidden;
    }

    body::before {
      content: "";
      position: fixed;
      inset: 0;
      pointer-events: none;
      background-image:
        linear-gradient(rgba(255,255,255,.3) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.3) 1px, transparent 1px);
      background-size: 34px 34px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.35), transparent 65%);
      z-index: -2;
    }

    body::after {
      content: "";
      position: fixed;
      width: 520px;
      height: 520px;
      right: -240px;
      top: 180px;
      border-radius: 999px;
      background: rgba(255,255,255,.42);
      box-shadow: -690px 130px 0 rgba(255,255,255,.26), -370px -210px 0 rgba(255,255,255,.22);
      z-index: -1;
    }

    a { color: inherit; text-decoration: none; }

    .topbar {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 12px 0 10px;
      background: linear-gradient(180deg, rgba(223,245,255,.96), rgba(223,245,255,.70));
      backdrop-filter: blur(14px);
      border-bottom: 1px solid rgba(255,255,255,.36);
    }

    .tabs {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 9px;
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
    }

    .tabs a {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 44px;
      border-radius: 999px;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(126,205,242,.35);
      color: var(--deep);
      font-size: 14px;
      font-weight: 900;
      box-shadow: 0 8px 22px rgba(70,166,215,.10);
      transition: transform .18s ease, background .18s ease, box-shadow .18s ease;
      white-space: nowrap;
    }

    .tabs a:hover {
      transform: translateY(-2px);
      background: rgba(255,255,255,.94);
      box-shadow: 0 12px 26px rgba(70,166,215,.14);
    }

    .tabs a.active {
      background: linear-gradient(135deg, #60c5ee, #a7e7ff);
      color: #fff;
      border-color: rgba(255,255,255,.82);
      text-shadow: 0 1px 0 rgba(0,0,0,.08);
    }

    .page {
      width: min(920px, calc(100% - 28px));
      margin: 0 auto;
      padding: 18px 0 44px;
    }

    .hero {
      position: relative;
      display: grid;
      grid-template-columns: 190px 1fr;
      gap: 24px;
      align-items: center;
      margin-top: 6px;
      padding: 30px;
      border: 1px solid rgba(255,255,255,.78);
      border-radius: 36px;
      background:
        linear-gradient(135deg, rgba(255,255,255,.95), rgba(227,247,255,.80)),
        url("data:image/svg+xml,%3Csvg width='120' height='120' xmlns='http://www.w3.org/2000/svg'%3E%3Ctext x='16' y='68' font-size='42' opacity='.13'%3E%E2%98%81%EF%B8%8F%3C/text%3E%3C/svg%3E");
      box-shadow: var(--shadow);
      overflow: hidden;
    }

    .hero.simple {
      grid-template-columns: 1fr;
      text-align: center;
      padding: 38px 24px 34px;
    }

    .hero::before {
      content: "☁️";
      position: absolute;
      left: 26px;
      top: 18px;
      font-size: 42px;
      opacity: .45;
      animation: float 4.5s ease-in-out infinite;
    }

    .hero::after {
      content: "🩵";
      position: absolute;
      right: 34px;
      bottom: 26px;
      font-size: 30px;
      opacity: .68;
      animation: float 5s ease-in-out infinite reverse;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0); }
      50% { transform: translateY(-9px); }
    }

    .avatar-wrap {
      position: relative;
      width: 178px;
      height: 178px;
      justify-self: center;
      border-radius: 44px;
      padding: 7px;
      background: linear-gradient(135deg, rgba(255,255,255,.96), rgba(165,231,255,.85));
      box-shadow: 0 18px 36px rgba(58, 154, 202, .20);
      animation: avatar-bob 4.8s ease-in-out infinite;
    }

    @keyframes avatar-bob {
      0%, 100% { transform: rotate(-2deg) translateY(0); }
      50% { transform: rotate(1deg) translateY(-7px); }
    }

    .avatar-wrap::before {
      content: "";
      position: absolute;
      inset: -8px;
      border-radius: 50px;
      border: 1px solid rgba(255,255,255,.62);
    }

    .avatar {
      width: 100%;
      height: 100%;
      display: block;
      object-fit: cover;
      border-radius: 37px;
      border: 1px solid rgba(255,255,255,.95);
      background: #fff;
    }

    .hero-text {
      position: relative;
      z-index: 1;
      text-align: left;
    }

    .hero.simple .hero-text { text-align: center; }

    .badge {
      display: inline-flex;
      align-items: center;
      gap: 8px;
      padding: 8px 15px;
      border-radius: 999px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(126,205,242,.34);
      color: var(--deep);
      font-size: 13px;
      font-weight: 900;
      box-shadow: 0 8px 20px rgba(70,166,215,.11);
    }

    h1 {
      margin: 14px 0 9px;
      font-size: clamp(46px, 8vw, 76px);
      line-height: .98;
      letter-spacing: -0.065em;
      color: #43addc;
      text-shadow: 0 5px 0 rgba(255,255,255,.86);
    }

    .subtitle {
      margin: 0;
      max-width: 620px;
      color: var(--muted);
      font-size: clamp(15px, 2.7vw, 18px);
      line-height: 1.78;
      word-break: keep-all;
      font-weight: 650;
    }

    .hero.simple .subtitle { margin: 0 auto; }

    .section {
      margin-top: 18px;
      padding: 24px;
      border-radius: var(--radius);
      background: var(--card);
      border: 1px solid rgba(255,255,255,.84);
      box-shadow: 0 14px 34px rgba(70,166,215,.12);
      backdrop-filter: blur(12px);
    }

    .section-title {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .section-title h2 {
      margin: 0;
      font-size: clamp(22px, 4vw, 30px);
      letter-spacing: -0.045em;
      color: var(--deep);
    }

    .pill {
      flex: 0 0 auto;
      padding: 7px 12px;
      border-radius: 999px;
      background: rgba(239,250,255,.92);
      color: #4faeda;
      font-size: 13px;
      font-weight: 950;
      border: 1px solid rgba(126,205,242,.32);
    }

    .profile-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .profile-card {
      position: relative;
      display: flex;
      flex-direction: column;
      gap: 8px;
      min-height: 94px;
      padding: 17px 18px;
      border-radius: 22px;
      background: linear-gradient(135deg, rgba(255,255,255,.78), rgba(240,251,255,.68));
      border: 1px solid var(--line);
      overflow: hidden;
    }

    .profile-card::after {
      content: "";
      position: absolute;
      right: -18px;
      bottom: -24px;
      width: 88px;
      height: 88px;
      border-radius: 999px;
      background: rgba(117,205,242,.10);
    }

    .profile-card.wide {
      grid-column: 1 / -1;
    }

    .profile-label {
      position: relative;
      z-index: 1;
      display: inline-flex;
      width: fit-content;
      align-items: center;
      gap: 6px;
      color: var(--blue);
      font-size: 12px;
      line-height: 1;
      font-weight: 950;
      letter-spacing: .02em;
      text-transform: uppercase;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.70);
      border: 1px solid rgba(126,205,242,.22);
    }

    .profile-value {
      position: relative;
      z-index: 1;
      color: var(--text);
      font-size: 21px;
      line-height: 1.35;
      letter-spacing: -0.04em;
      font-weight: 950;
      word-break: keep-all;
    }

    .profile-sub {
      display: block;
      margin-top: 3px;
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.45;
      letter-spacing: -0.02em;
      font-weight: 700;
    }

    .split-card {
      grid-column: 1 / -1;
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 0;
      padding: 0;
      min-height: 104px;
    }

    .split-item {
      position: relative;
      padding: 17px 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.78), rgba(240,251,255,.68));
    }

    .split-item + .split-item {
      border-left: 1px solid var(--line);
    }

    .split-big {
      font-size: 26px;
      font-weight: 950;
      color: var(--text);
      letter-spacing: -0.04em;
      margin-top: 8px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }

    .info {
      display: grid;
      grid-template-columns: 108px 1fr;
      gap: 10px;
      align-items: start;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.68);
      border: 1px solid var(--line);
    }

    .label {
      color: var(--blue);
      font-weight: 950;
      white-space: nowrap;
    }

    .value {
      color: var(--text);
      font-weight: 720;
      line-height: 1.65;
      word-break: keep-all;
    }

    .rp-wrap {
      display: grid;
      grid-template-columns: 1.05fr 1.4fr;
      gap: 16px;
      align-items: stretch;
    }

    .rp-text-card {
      padding: 20px;
      border-radius: 24px;
      background: linear-gradient(135deg, rgba(239,250,255,.96), rgba(255,255,255,.82));
      border: 1px solid var(--line);
      display: flex;
      flex-direction: column;
      justify-content: center;
      min-height: 220px;
    }

    .rp-keyword {
      display: inline-flex;
      width: fit-content;
      padding: 8px 14px;
      border-radius: 999px;
      background: rgba(96,197,238,.13);
      color: var(--deep);
      font-size: 14px;
      font-weight: 950;
      border: 1px solid rgba(96,197,238,.24);
      margin-bottom: 12px;
    }

    .rp-main {
      font-size: clamp(28px, 5vw, 44px);
      font-weight: 950;
      letter-spacing: -0.06em;
      color: #43addc;
      line-height: 1.1;
      margin-bottom: 12px;
    }

    .rp-desc {
      color: var(--muted);
      line-height: 1.75;
      font-size: 14.5px;
      font-weight: 700;
      word-break: keep-all;
    }

    .rp-image-card {
      padding: 12px;
      border-radius: 24px;
      background: rgba(255,255,255,.72);
      border: 1px solid var(--line);
    }

    .rp-image-card img {
      display: block;
      width: 100%;
      height: 100%;
      max-height: 360px;
      object-fit: contain;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,.9);
      background: #f8f4f1;
    }

    .cards {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
    }

    .mini-card {
      padding: 18px 16px;
      border-radius: 22px;
      background: rgba(255,255,255,.68);
      border: 1px solid var(--line);
      text-align: center;
      transition: transform .18s ease, box-shadow .18s ease;
    }

    .mini-card:hover {
      transform: translateY(-3px);
      box-shadow: 0 14px 30px rgba(70,166,215,.12);
    }

    .mini-card .icon {
      display: grid;
      place-items: center;
      min-height: 38px;
      font-size: 28px;
      margin-bottom: 7px;
    }

    .mini-card strong {
      display: block;
      color: var(--deep);
      font-size: 17px;
      margin-bottom: 5px;
    }

    .mini-card span {
      color: var(--muted);
      font-size: 14px;
      line-height: 1.6;
      font-weight: 720;
    }

    .timeline {
      display: grid;
      gap: 12px;
    }

    .event {
      display: grid;
      grid-template-columns: 116px 1fr;
      gap: 12px;
      align-items: center;
      padding: 15px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.70);
      border: 1px solid var(--line);
    }

    .date {
      display: inline-flex;
      justify-content: center;
      align-items: center;
      min-height: 36px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(230,247,255,.96);
      color: var(--deep);
      font-weight: 950;
      font-size: 14px;
    }

    .event-name {
      font-weight: 900;
      color: var(--text);
    }

    .schedule-shell {
      border-radius: 28px;
      background: linear-gradient(135deg, rgba(255,255,255,.78), rgba(239,250,255,.78));
      border: 1px solid var(--line);
      padding: 14px;
      box-shadow: 0 14px 34px rgba(70,166,215,.10);
    }

    .schedule-frame {
      display: block;
      width: 100%;
      border: 0;
      border-radius: 20px;
      background: #fff;
    }

    .calendar-frame { height: 720px; }
    .upcoming-frame { height: 430px; }

    .calendar-note {
      margin: 12px 2px 0;
      color: var(--muted);
      font-size: 13px;
      font-weight: 650;
      line-height: 1.7;
      word-break: keep-all;
    }

    .custom-plan {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 12px;
      margin-top: 12px;
    }

    .plan-card {
      padding: 15px 14px;
      border-radius: 18px;
      background: rgba(255,255,255,.65);
      border: 1px solid var(--line);
      color: var(--muted);
      font-size: 13.5px;
      line-height: 1.6;
      font-weight: 700;
      word-break: keep-all;
    }

    .plan-card strong {
      display: block;
      color: var(--deep);
      font-size: 15px;
      margin-bottom: 4px;
    }

    .footer {
      margin-top: 20px;
      text-align: center;
      color: #74a9c2;
      font-size: 13px;
      font-weight: 850;
    }

    @media (max-width: 720px) {
      .tabs {
        width: min(100% - 18px, 920px);
        gap: 6px;
      }

      .tabs a {
        min-height: 40px;
        font-size: 12px;
        padding: 0 4px;
      }

      .page {
        width: min(100% - 18px, 920px);
        padding-top: 8px;
      }

      .hero {
        grid-template-columns: 1fr;
        padding: 28px 16px 24px;
        border-radius: 30px;
        text-align: center;
      }

      .hero::before {
        left: 16px;
        top: 12px;
        font-size: 34px;
      }

      .hero::after {
        right: 20px;
        bottom: 20px;
      }

      .avatar-wrap {
        width: 148px;
        height: 148px;
        border-radius: 38px;
      }

      .avatar { border-radius: 31px; }
      .hero-text { text-align: center; }
      .subtitle { margin: 0 auto; }
      .section { padding: 20px 15px; }

      .section-title {
        align-items: flex-start;
        flex-direction: column;
      }

      .profile-grid,
      .grid,
      .cards,
      .rp-wrap,
      .custom-plan {
        grid-template-columns: 1fr;
      }

      .split-card {
        grid-template-columns: 1fr;
      }

      .split-item + .split-item {
        border-left: 0;
        border-top: 1px solid var(--line);
      }

      .info {
        grid-template-columns: 88px 1fr;
        padding: 14px 13px;
      }

      .rp-text-card {
        min-height: auto;
      }

      .rp-image-card img {
        max-height: none;
      }

      .event {
        grid-template-columns: 1fr;
        gap: 8px;
      }

      .date {
        justify-content: flex-start;
        width: fit-content;
      }

      .calendar-frame { height: 620px; }
      .upcoming-frame { height: 420px; }
    }

    .custom-calendar-shell {
      border-radius: 30px;
      background: linear-gradient(135deg, rgba(255,255,255,.80), rgba(239,250,255,.82));
      border: 1px solid var(--line);
      padding: 18px;
      box-shadow: 0 14px 34px rgba(70,166,215,.10);
    }

    .calendar-toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
      margin-bottom: 16px;
    }

    .calendar-title {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .calendar-title strong {
      color: var(--text);
      font-size: clamp(24px, 4vw, 34px);
      line-height: 1.15;
      font-weight: 950;
      letter-spacing: -0.055em;
    }

    .calendar-title span {
      color: var(--muted);
      font-size: 13px;
      font-weight: 750;
    }

    .cal-nav {
      display: flex;
      gap: 8px;
    }

    .cal-btn {
      border: 1px solid rgba(126,205,242,.34);
      background: rgba(255,255,255,.78);
      color: var(--deep);
      border-radius: 999px;
      height: 38px;
      min-width: 38px;
      padding: 0 13px;
      font-weight: 950;
      cursor: pointer;
      box-shadow: 0 8px 18px rgba(70,166,215,.10);
    }

    .cal-btn:hover {
      background: #fff;
    }

    .calendar-legend {
      display: flex;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 13px;
    }

    .legend-item {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      background: rgba(255,255,255,.66);
      border: 1px solid rgba(126,205,242,.20);
      color: var(--muted);
      font-size: 12px;
      font-weight: 800;
    }

    .legend-dot {
      width: 9px;
      height: 9px;
      border-radius: 999px;
      background: #60c5ee;
    }

    .legend-dot.broadcast { background: #56c39b; }
    .legend-dot.break { background: #8c8f95; }
    .legend-dot.event { background: #ff6f9b; }
    .legend-dot.other { background: #6ca7e8; }

    .calendar-week {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
      margin-bottom: 7px;
      color: #7b8d99;
      font-size: 12px;
      font-weight: 950;
      text-align: center;
    }

    .calendar-week span:first-child {
      color: #d19a68;
    }

    .calendar-week span:last-child {
      color: #6c9fe5;
    }

    .calendar-grid-custom {
      display: grid;
      grid-template-columns: repeat(7, 1fr);
      gap: 7px;
    }

    .day-cell {
      min-height: 112px;
      padding: 9px 8px;
      border-radius: 17px;
      background: rgba(255,255,255,.68);
      border: 1px solid rgba(126,205,242,.18);
      overflow: hidden;
    }

    .day-cell.outside {
      opacity: .43;
    }

    .day-cell.today {
      border-color: rgba(79,182,228,.72);
      box-shadow: inset 0 0 0 1px rgba(79,182,228,.34), 0 10px 18px rgba(70,166,215,.08);
      background: rgba(255,255,255,.88);
    }

    .day-number {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 7px;
      color: var(--text);
      font-size: 13px;
      font-weight: 950;
    }

    .today-badge {
      display: inline-flex;
      align-items: center;
      height: 20px;
      padding: 0 7px;
      border-radius: 999px;
      background: rgba(96,197,238,.18);
      color: var(--deep);
      font-size: 10px;
      font-weight: 950;
    }

    .event-chip {
      display: block;
      width: 100%;
      margin-top: 5px;
      padding: 5px 7px;
      border-radius: 9px;
      color: #fff;
      font-size: 11px;
      line-height: 1.25;
      font-weight: 900;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
      background: #60c5ee;
    }

    .event-chip.broadcast { background: #56c39b; }
    .event-chip.break { background: #74777d; }
    .event-chip.event { background: #ff6f9b; }
    .event-chip.other { background: #6ca7e8; }

    .more-chip {
      color: var(--muted);
      font-size: 11px;
      font-weight: 850;
      margin-top: 5px;
      padding-left: 2px;
    }

    .upcoming-list {
      display: grid;
      gap: 10px;
    }

    .upcoming-card {
      display: grid;
      grid-template-columns: 5px 1fr auto;
      gap: 14px;
      align-items: center;
      min-height: 76px;
      padding: 14px 16px;
      border-radius: 18px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(126,205,242,.20);
    }

    .upcoming-bar {

        </div>

          <iframe
            class="schedule-frame calendar-frame"
            src="https://calendar.google.com/calendar/embed?src=imhanbily%40gmail.com&ctz=Asia%2FSeoul&mode=MONTH&showTitle=0&showNav=1&showDate=1&showPrint=0&showTabs=0&showCalendars=0&showTz=0"

    <script>
      const API_URL = "/api/calendar";
      const calendarGrid = document.getElementById("calendarGrid");
      const upcomingList = document.getElementById("upcomingList");
      const monthTitle = document.getElementById("monthTitle");
      const monthSubtitle = document.getElementById("monthSubtitle");
      const fallback = document.getElementById("calendarFallback");

      const today = new Date();
      let viewYear = today.getFullYear();
      let viewMonth = today.getMonth();

      const pad = (n) => String(n).padStart(2, "0");
      const ymd = (date) => `${date.getFullYear()}-${pad(date.getMonth()+1)}-${pad(date.getDate())}`;

      function eventType(summary = "") {
        const text = summary.toLowerCase();
        if (summary.includes("휴방") || text.includes("off")) return "break";
        if (summary.includes("이벤트") || summary.includes("대회") || text.includes("event")) return "event";
        if (summary.includes("방송") || summary.includes("합방") || summary.includes("노래") || summary.includes("뱅")) return "broadcast";
        return "other";
      }

      function typeLabel(type) {
        return {
          broadcast: "방송",
          break: "휴방",
          event: "이벤트",
          other: "기타"
        }[type] || "기타";
      }

      function formatKoreanDate(iso) {
        const d = new Date(iso);
        const days = ["일", "월", "화", "수", "목", "금", "토"];
        return `${d.getFullYear()}년 ${d.getMonth()+1}월 ${d.getDate()}일 (${days[d.getDay()]})`;
      }

      function formatTimeOnly(iso) {
        const d = new Date(iso);
        if (d.getHours() === 0 && d.getMinutes() === 0) return "";
        return `${pad(d.getHours())}:${pad(d.getMinutes())}`;
      }

      function openEventModal(ev) {
        const type = eventType(ev.summary);
        const time = formatTimeOnly(ev.start);
        document.getElementById("modalTitle").textContent = ev.summary;
        document.getElementById("modalDate").textContent = formatKoreanDate(ev.start);
        document.getElementById("modalTime").textContent = time || "종일";
        document.getElementById("modalType").textContent = typeLabel(type);
        document.getElementById("modalTag").textContent = typeLabel(type);
        const dot = document.getElementById("modalDot");
        dot.className = `event-modal-dot ${type}`;
        const modal = document.getElementById("eventModal");
        modal.classList.add("active");
        modal.setAttribute("aria-hidden", "false");
      }

      function closeEventModal() {
        const modal = document.getElementById("eventModal");
        modal.classList.remove("active");
        modal.setAttribute("aria-hidden", "true");
      }

      document.getElementById("eventClose").addEventListener("click", closeEventModal);
      document.getElementById("eventModal").addEventListener("click", (e) => {
        if (e.target.id === "eventModal") closeEventModal();
      });
      document.addEventListener("keydown", (e) => {
        if (e.key === "Escape") closeEventModal();
      });

      function formatDateTime(iso) {
        const d = new Date(iso);
        const date = `${d.getMonth()+1}/${d.getDate()}`;
        const days = ["일", "월", "화", "수", "목", "금", "토"];
        const isMidnight = d.getHours() === 0 && d.getMinutes() === 0;
        const time = `${pad(d.getHours())}:${pad(d.getMinutes())}`;
        return isMidnight ? `${date} (${days[d.getDay()]})` : `${date} (${days[d.getDay()]}) · ${time}`;
      }

      function monthRange(year, month) {
        const start = new Date(year, month, 1);
        const end = new Date(year, month + 1, 0, 23, 59, 59);
        return { start: ymd(start), end: ymd(end) };
      }

      async function fetchEvents(year, month) {
        const range = monthRange(year, month);
        const url = `${API_URL}?start=${range.start}&end=${range.end}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`API ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "calendar fetch failed");
        return data.events || [];
      }

      async function fetchUpcoming() {
        const start = ymd(today);
        const endDate = new Date(today);
        endDate.setDate(endDate.getDate() + 60);
        const url = `${API_URL}?start=${start}&end=${ymd(endDate)}`;
        const res = await fetch(url, { cache: "no-store" });
        if (!res.ok) throw new Error(`API ${res.status}`);
        const data = await res.json();
        if (!data.ok) throw new Error(data.error || "calendar fetch failed");
        return (data.events || []).filter(e => new Date(e.start) >= new Date(today.getFullYear(), today.getMonth(), today.getDate())).slice(0, 8);
      }

      function renderCalendar(events) {
        calendarGrid.innerHTML = "";
        const first = new Date(viewYear, viewMonth, 1);
        const last = new Date(viewYear, viewMonth + 1, 0);
        const startDay = first.getDay();
        const totalDays = last.getDate();

        const prevLast = new Date(viewYear, viewMonth, 0).getDate();
        const cells = [];
        for (let i = startDay - 1; i >= 0; i--) {
          cells.push({ day: prevLast - i, outside: true, date: new Date(viewYear, viewMonth - 1, prevLast - i) });
        }
        for (let d = 1; d <= totalDays; d++) {
          cells.push({ day: d, outside: false, date: new Date(viewYear, viewMonth, d) });
        }
        while (cells.length % 7 !== 0) {
          const d = cells.length - startDay - totalDays + 1;
          cells.push({ day: d, outside: true, date: new Date(viewYear, viewMonth + 1, d) });
        }

        const byDay = new Map();
        for (const ev of events) {
          const key = ymd(new Date(ev.start));
          if (!byDay.has(key)) byDay.set(key, []);
          byDay.get(key).push(ev);
        }

        for (const cell of cells) {
          const key = ymd(cell.date);
          const dayEvents = byDay.get(key) || [];
          const isToday = key === ymd(today);
          const div = document.createElement("div");
          div.className = `day-cell${cell.outside ? " outside" : ""}${isToday ? " today" : ""}`;
          div.innerHTML = `<div class="day-number"><span>${cell.day}</span>${isToday ? '<span class="today-badge">TODAY</span>' : ''}</div>`;

          dayEvents.slice(0, 3).forEach(ev => {
            const type = eventType(ev.summary);
            const chip = document.createElement("span");
            chip.className = `event-chip ${type}`;
            const d = new Date(ev.start);
            chip.title = ev.summary;
            const isMidnight = d.getHours() === 0 && d.getMinutes() === 0;
            chip.classList.toggle("no-time", isMidnight);
            chip.innerHTML = isMidnight
              ? `<span class="event-title">${ev.summary}</span>`
              : `<span class="event-time">${pad(d.getHours())}:${pad(d.getMinutes())}</span><span class="event-title">${ev.summary}</span>`;
            chip.addEventListener("click", (e) => {
              e.stopPropagation();
              openEventModal(ev);
            });
            div.appendChild(chip);
          });

          if (dayEvents.length > 3) {
            const more = document.createElement("div");
            more.className = "more-chip";
            more.textContent = `+${dayEvents.length - 3} more`;
            div.appendChild(more);
          }

          calendarGrid.appendChild(div);
        }
      }

      function renderUpcoming(events) {
        upcomingList.innerHTML = "";
        if (!events.length) {
          upcomingList.innerHTML = '<div class="calendar-status">다가오는 일정이 아직 없어요.</div>';
          return;
        }

        events.forEach(ev => {
          const type = eventType(ev.summary);
          const card = document.createElement("div");
          card.className = "upcoming-card";
          card.innerHTML = `
            <div class="upcoming-bar ${type}"></div>
            <div class="upcoming-main">
              <strong>${ev.summary}</strong>
              <span>${formatDateTime(ev.start)}</span>
            </div>
            <div class="upcoming-tag">${typeLabel(type)}</div>
          `;
          card.style.cursor = "pointer";
          card.addEventListener("click", () => openEventModal(ev));
          upcomingList.appendChild(card);
        });
      }

      async function loadAll() {
        const monthName = `${viewYear}년 ${viewMonth + 1}월`;
        monthTitle.textContent = monthName;

        try {
          const [monthEvents, upcoming] = await Promise.all([
            fetchEvents(viewYear, viewMonth),
            fetchUpcoming()
          ]);
          fallback.classList.remove("active");
          renderCalendar(monthEvents);
          renderUpcoming(upcoming);
        } catch (err) {
          console.error(err);
          calendarGrid.innerHTML = '<div class="calendar-status">커스텀 캘린더 연동에 실패했어요. 아래 Google Calendar iframe을 확인해주세요.</div>';
          fallback.classList.add("active");
          upcomingList.innerHTML = '<div class="calendar-status">UPCOMING 자동 연동에 실패했어요. 캘린더 공개 설정이 필요할 수 있어요.</div>';
        }
      }

      document.getElementById("prevMonth").addEventListener("click", () => {
        viewMonth--;
        if (viewMonth < 0) { viewMonth = 11; viewYear--; }
        loadAll();
      });

      document.getElementById("nextMonth").addEventListener("click", () => {
        viewMonth++;
        if (viewMonth > 11) { viewMonth = 0; viewYear++; }
        loadAll();
      });

      document.getElementById("todayMonth").addEventListener("click", () => {
        viewYear = today.getFullYear();
        viewMonth = today.getMonth();
        loadAll();
      });

      loadAll();
    </script>
  </main>
</body>
</html>
